[package]
name = "portmate-mcp-rust-client-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
rmcp = { version = "=1.1.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1.48", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
