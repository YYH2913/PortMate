name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-dependency-audit:
    name: Rust dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - run: npm run test:rust-dependency-audit

  portable-cross:
    name: Portable Rust cross-target checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin,x86_64-unknown-freebsd

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm run test:release-source
      - run: npm run test:portable-cross

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"

      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install native Perl on Windows
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          distribution: strawberry

      - name: Pin native Perl for vendored OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -ErrorAction Stop).Source
          $perlOs = & $perl -e 'print $^O'
          if ($perlOs -ne 'MSWin32') {
            throw "OpenSSL requires native Windows Perl, found $perlOs at $perl"
          }
          $nmake = (Get-Command nmake.exe -ErrorAction Stop).Source
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # OpenSSL's generated recursive rules use $(MAKE), which setup actions may leave pointing at GNU make.
          "MAKE=nmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vendored OpenSSL tools: perl=$perl ($perlOs), recursive make=$nmake"

      - name: Install pinned Swift SDK client toolchain
        uses: swift-actions/setup-swift@v3
        if: runner.os != 'Windows'
        with:
          swift-version: "6.3.3"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            gnome-keyring \
            libglib2.0-bin \
            libkrb5-dev \
            libssh-dev \
            librsvg2-dev \
            libudev-dev \
            openbox \
            patchelf \
            rpm \
            wmctrl \
            x11-apps \
            x11-utils \
            xvfb

      - run: npm ci
      - name: Verify npm dependency policy
        run: node scripts/ci-command-log.mjs target/native-ci/dependency-audit.log npm run test:dependency-audit
      - name: Verify native keyring dependency boundary
        run: node scripts/ci-command-log.mjs target/native-ci/native-keyring-dependencies.log npm run test:native-keyring-dependencies
      - name: Verify Rust formatting
        run: node scripts/ci-command-log.mjs target/native-ci/rustfmt.log cargo fmt --all -- --check
      - name: Verify frontend and script tests
        run: node scripts/ci-command-log.mjs target/native-ci/frontend-tests.log npm test
      - name: Build frontend
        run: node scripts/ci-command-log.mjs target/native-ci/frontend-build.log npm run build
      - name: Verify previous release app-data upgrade
        run: node scripts/ci-command-log.mjs target/native-ci/release-upgrade.log npm run test:release-upgrade
      - name: Verify portable vault fault matrix
        run: node scripts/ci-command-log.mjs target/native-ci/portable-vault.log npm run test:portable-vault
      - name: Verify workspace Rust tests
        run: >
          node scripts/ci-command-log.mjs target/native-ci/workspace-tests.log
          cargo test --locked --workspace --
          --test-threads=1
          --skip tests::portable_vault_tests::portable_vault_cross_process_fault_matrix
      - name: Verify workspace Clippy
        run: node scripts/ci-command-log.mjs target/native-ci/clippy.log cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify native keyring lifecycle and faults
        run: node scripts/ci-command-log.mjs target/native-ci/native-keyring.log npm run test:native-keyring
      - name: Smoke-test the native Linux WebKit window
        if: runner.os == 'Linux'
        env:
          PORTMATE_NATIVE_SMOKE_XWD: ${{ github.workspace }}/target/native-ci/linux-desktop.xwd
        run: >
          dbus-run-session -- xvfb-run --auto-servernum
          --server-args="-screen 0 1440x900x24 -nolisten tcp"
          sh -eu -c '
          mkdir -p target/native-ci;
          openbox >target/native-ci/openbox-desktop.log 2>&1 &
          wm_pid=$!;
          trap "kill $wm_pid 2>/dev/null || true" EXIT;
          for attempt in $(seq 1 40); do wmctrl -m >/dev/null 2>&1 && break; sleep 0.1; done;
          wmctrl -m;
          node scripts/ci-command-log.mjs target/native-ci/linux-desktop-smoke.log npm run test:linux-desktop-smoke'
      - name: Verify libssh GSSAPI build
        if: runner.os == 'Linux'
        run: node scripts/ci-command-log.mjs target/native-ci/libssh-gssapi-build.log npm run test:libssh-gssapi-build
      - name: Verify SSH GSSAPI compatibility matrix
        if: runner.os == 'Linux'
        run: node scripts/ci-command-log.mjs target/native-ci/ssh-gssapi-compat.log npm run test:ssh-gssapi-compat
      - name: Verify MCP TypeScript SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-typescript-client.log npm run test:mcp-typescript-client
      - name: Verify MCP Python SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-python-client.log npm run test:mcp-python-client
      - name: Verify MCP Go SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-go-client.log npm run test:mcp-go-client
      - name: Verify MCP Rust SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-rust-client.log npm run test:mcp-rust-client
      - name: Verify MCP Ruby SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-ruby-client.log npm run test:mcp-ruby-client
      - name: Verify MCP Java SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-java-client.log npm run test:mcp-java-client
      - name: Verify MCP Kotlin SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-kotlin-client.log npm run test:mcp-kotlin-client
      - name: Verify MCP C# SDK clients
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-csharp-client.log npm run test:mcp-csharp-client
      - name: Verify MCP Swift SDK clients
        if: runner.os != 'Windows'
        run: node scripts/ci-command-log.mjs target/native-ci/mcp-swift-client.log npm run test:mcp-swift-client
      - name: Build native package bundles
        run: node scripts/ci-command-log.mjs target/native-ci/desktop-build.log npm run desktop:build
      - name: Smoke-test packaged Linux AppImage restart, migration, and conflict rejection
        if: runner.os == 'Linux'
        env:
          PORTMATE_NATIVE_SMOKE_XWD: ${{ github.workspace }}/target/native-ci/linux-appimage.xwd
        run: >
          dbus-run-session -- xvfb-run --auto-servernum
          --server-args="-screen 0 1440x900x24 -nolisten tcp"
          sh -eu -c '
          mkdir -p target/native-ci;
          openbox >target/native-ci/openbox-appimage.log 2>&1 &
          wm_pid=$!;
          trap "kill $wm_pid 2>/dev/null || true" EXIT;
          for attempt in $(seq 1 40); do wmctrl -m >/dev/null 2>&1 && break; sleep 0.1; done;
          wmctrl -m;
          node scripts/ci-command-log.mjs target/native-ci/linux-appimage-smoke.log npm run test:linux-appimage-smoke'
      - name: Verify Linux packages, application lifecycle, and packaged MCP sidecars
        if: runner.os == 'Linux'
        run: >
          dbus-run-session -- xvfb-run --auto-servernum
          --server-args="-screen 0 1440x900x24 -nolisten tcp"
          sh -eu -c '
          mkdir -p target/native-ci;
          openbox >target/native-ci/openbox-package.log 2>&1 &
          wm_pid=$!;
          trap "kill $wm_pid 2>/dev/null || true" EXIT;
          for attempt in $(seq 1 40); do wmctrl -m >/dev/null 2>&1 && break; sleep 0.1; done;
          wmctrl -m;
          node scripts/ci-command-log.mjs target/native-ci/linux-package.log npm run test:linux-package'
      - name: Verify Windows packages, restart/migration, and conflict rejection
        if: runner.os == 'Windows'
        run: node scripts/ci-command-log.mjs target/native-ci/windows-package.log npm run test:windows-package
      - name: Verify macOS packages, restart/migration, and conflict rejection
        if: runner.os == 'macOS'
        run: node scripts/ci-command-log.mjs target/native-ci/macos-package.log npm run test:macos-package

      - name: Upload native package bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portmate-${{ matrix.os }}-bundle
          path: target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native build and package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portmate-${{ matrix.os }}-diagnostics
          path: target/native-ci/**
          if-no-files-found: warn
          retention-days: 14

  linux-compatibility:
    name: Linux compatibility matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      PORTMATE_CHROME: /usr/bin/google-chrome
      PORTMATE_TERMINAL_SCREENSHOT_PREFIX: ${{ github.workspace }}/target/native-ci/terminal
      PORTMATE_TMUX_SCREENSHOT_PREFIX: ${{ github.workspace }}/target/native-ci/tmux
      PORTMATE_VTTEST_SCREENSHOT_PREFIX: ${{ github.workspace }}/target/native-ci/vttest
      PORTMATE_WORKSPACE_UI_SCREENSHOT_PREFIX: ${{ github.workspace }}/target/native-ci/workspace

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"

      - name: Install compatibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            less \
            procps \
            util-linux \
            vim
          test -x /usr/bin/google-chrome
          docker info

      - run: npm ci
      - run: mkdir -p target/native-ci
      - run: node scripts/ci-command-log.mjs target/native-ci/ssh-server-compat.log npm run test:ssh-server-compat
      - run: node scripts/ci-command-log.mjs target/native-ci/tcp-telnet-server-compat.log npm run test:tcp-telnet-server-compat
      - run: node scripts/ci-command-log.mjs target/native-ci/tmux-version-compat.log npm run test:tmux-version-compat
      - run: node scripts/ci-command-log.mjs target/native-ci/vttest-compat.log npm run test:vttest-compat
      - run: node scripts/ci-command-log.mjs target/native-ci/terminal-compat.log npm run test:terminal-compat
      - run: node scripts/ci-command-log.mjs target/native-ci/tmux-workflow.log npm run test:tmux-workflow
      - run: node scripts/ci-command-log.mjs target/native-ci/workspace-ui.log npm run test:workspace-ui

      - name: Upload compatibility logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portmate-linux-compatibility-diagnostics
          path: target/native-ci/**
          if-no-files-found: warn
          retention-days: 14
