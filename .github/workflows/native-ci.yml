name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            rpm

      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace -- --test-threads=4
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run test:mcp-python-client
      - run: npm run test:mcp-go-client
      - run: npm run test:mcp-rust-client
      - run: npm run test:mcp-ruby-client
      - run: npm run test:mcp-java-client
      - run: npm run test:mcp-kotlin-client
      - run: npm run test:mcp-csharp-client
      - run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: portmate-${{ matrix.os }}-bundle
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  linux-compatibility:
    name: Linux compatibility matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      PORTMATE_CHROME: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Install compatibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            less \
            procps \
            util-linux \
            vim
          test -x /usr/bin/google-chrome
          docker info

      - run: npm ci
      - run: npm run test:mcp-stdio-client
      - run: npm run test:mcp-http-client
      - run: npm run test:mcp-python-client
      - run: npm run test:mcp-go-client
      - run: npm run test:mcp-rust-client
      - run: npm run test:mcp-ruby-client
      - run: npm run test:mcp-java-client
      - run: npm run test:mcp-kotlin-client
      - run: npm run test:mcp-csharp-client
      - run: npm run test:ssh-server-compat
      - run: npm run test:tcp-telnet-server-compat
      - run: npm run test:tmux-version-compat
      - run: npm run test:vttest-compat
      - run: npm run test:terminal-compat
      - run: npm run test:tmux-workflow
      - run: npm run test:workspace-ui
