[package]
name = "russh-sftp"
version = "2.1.2"
edition = "2021"
description = "SFTP subsystem supported server and client for Russh"
readme = "README.md"
repository = "https://github.com/AspectUnk/russh-sftp"
license = "Apache-2.0"
keywords = ["russh", "sftp", "ssh2", "server", "client"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
bitflags = { version = "2.13.1", features = ["serde"] }
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
  "io-util",
  "rt",
  "sync",
  "time",
  "macros",
] }
tokio-util = "0.7.19"

[features]
async-trait = ["dep:async-trait"]
