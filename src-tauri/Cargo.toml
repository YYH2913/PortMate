[package]
name = "portmate"
version = "0.1.0"
description = "MCP-ready serial and SSH co-debugging assistant"
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "portmate"

[lib]
name = "portmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
portmate-core = { path = "../crates/portmate-core" }
portmate-kdf = { path = "../crates/portmate-kdf" }
portmate-keyring = { path = "../crates/portmate-keyring" }
base64.workspace = true
chrono.workspace = true
ed25519-dalek = "3.0.0"
flate2 = "1.1.9"
getrandom = { version = "0.4", features = ["sys_rng"] }
iota_stronghold = "2.1.0"
keyring-core = "1.0.0"
libloading = "0.8.9"
libssh-rs = { path = "../crates/libssh-rs" }
libc = "0.2"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
russh = { version = "0.62.5", features = ["async-trait"] }
russh-sftp = { path = "../crates/russh-sftp" }
portable-pty = "0.9"
regex.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha1_11 = { package = "sha1", version = "0.11", features = ["oid"] }
sha2.workspace = true
serialport = { version = "4.9", default-features = false }
socket2 = { version = "0.6.3", features = ["all"] }
native-tls = "0.2.18"
tar = "0.4.46"
tauri = { version = "2.10.3", features = [] }
tempfile = "3.27"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-native-tls = "0.3.1"
uuid.workspace = true
url = "2.5"
zeroize = "1"
zmodem2 = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
rcgen = "0.14.8"
