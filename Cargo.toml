[workspace]
members = [
  "crates/libssh-rs",
  "crates/libssh-rs-sys",
  "crates/portmate-core",
  "crates/portmate-kdf",
  "crates/portmate-keyring",
  "crates/portmate-mcp",
  "crates/portmate-process-watchdog",
  "crates/russh-sftp",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["PortMate Contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
ipnet = "2.12.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.dev.package.portmate-kdf]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.test.package.portmate-kdf]
opt-level = 3

[profile.test.package."*"]
opt-level = 2
