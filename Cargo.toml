[workspace]
members = [
  "crates/libssh-rs",
  "crates/libssh-rs-sys",
  "crates/portmate-core",
  "crates/portmate-kdf",
  "crates/portmate-keyring",
  "crates/portmate-mcp",
  "crates/portmate-process-watchdog",
  "crates/russh-sftp",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["PortMate Contributors"]

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4.3"
ipnet = "2.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.dev.package.portmate-kdf]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.test.package.portmate-kdf]
opt-level = 3

[profile.test.package."*"]
opt-level = 2
